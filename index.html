        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased;
            background: var(--bg-off-white);
            color: var(--color-soft-black);
            line-height: 1.6;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        
        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* Gradient Text Animation - GPU accelerated */
        @keyframes gradientFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Toast Slide In Animation - GPU accelerated */
        @keyframes slideInRight {
            from {
                transform: translateX(400px) translateZ(0);
                opacity: 0;
            }
            to {
                transform: translateX(0) translateZ(0);
                opacity: 1;
            }
        }

        .gradient-text {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899, #f59e0b);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientFlow 6s ease infinite;
        }

        /* Deep Space Hero Background */
        .space-hero {
            position: relative;
            min-height: 100vh;
            background: #000000;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 10% 20%, white, transparent),
                radial-gradient(2px 2px at 90% 80%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(1px 1px at 80% 10%, white, transparent),
                radial-gradient(2px 2px at 30% 70%, white, transparent),
                radial-gradient(1px 1px at 70% 30%, white, transparent);
            background-size: 250% 250%;
            animation: twinkle 10s ease-in-out infinite;
            opacity: 0.6;
            will-change: transform, opacity;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        .nebula {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 30% 40%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 70%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 20%, rgba(236, 72, 153, 0.12) 0%, transparent 50%);
            animation: nebulaMove 25s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes nebulaMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(40px, -40px) rotate(5deg); }
            66% { transform: translate(-40px, 40px) rotate(-5deg); }
        }

        .planet {
            position: absolute;
            width: clamp(200px, 30vw, 400px);
            height: clamp(200px, 30vw, 400px);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(139, 92, 246, 0.4), rgba(59, 130, 246, 0.2));
            box-shadow: 
                inset -30px -30px 60px rgba(0, 0, 0, 0.4),
                0 0 150px rgba(139, 92, 246, 0.3);
            top: 50%;
            right: 5%;
            transform: translateY(-50%);
            animation: planetSpin 40s linear infinite;
            will-change: transform;
        }

        @keyframes planetSpin {
            from { transform: translateY(-50%) rotate(0deg); }
            to { transform: translateY(-50%) rotate(360deg); }
        }

        /* Floating WhatsApp Button */
        .whatsapp-float {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 25px;
            right: 25px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff;
            border-radius: 50%;
            text-align: center;
            font-size: 32px;
            box-shadow: 0 8px 24px rgba(37, 211, 102, 0.5);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulse 2.5s infinite;
            text-decoration: none;
        }

        .whatsapp-float:hover {
            transform: scale(1.15);
            box-shadow: 0 12px 36px rgba(37, 211, 102, 0.7);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 24px rgba(37, 211, 102, 0.5); }
            50% { box-shadow: 0 8px 36px rgba(37, 211, 102, 0.8), 0 0 0 15px rgba(37, 211, 102, 0.1); }
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Testimonial Float */
        .testimonial-float {
            position: fixed;
            bottom: 110px;
            right: 25px;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            max-width: 320px;
            z-index: 9999;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(450px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .testimonial-float.hide {
            animation: slideOut 0.5s ease forwards;
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(450px); opacity: 0; }
        }

        /* Sticky Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            transition: transform 0.3s ease, all 0.3s ease;
            padding: 20px 0;
        }

        /* Nav hidden class - ONLY applies on mobile */
        @media (max-width: 768px) {
            nav.nav-hidden {
                transform: translateY(-100%);
            }
        }

        nav.scrolled {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        nav.scrolled .nav-link {
            color: #1e293b;
        }

        nav.scrolled .nav-link:hover {
            color: #8b5cf6;
        }

        nav.scrolled .nav-link.active {
            color: #8b5cf6;
        }

        nav.scrolled .logo-text {
            color: #1e293b;
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            z-index: 1001;
            position: relative;
        }

        .logo img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            pointer-events: none;
        }

        /* Adaptive logo: two imgs, show/hide based on nav state */
        .brand-logo-dark  { height: 36px; width: auto; display: none; pointer-events: none; }
        .brand-logo-light { height: 36px; width: auto; display: block; pointer-events: none; }
        /* Transparent nav (dark hero) → show white logo */
        nav:not(.scrolled) .brand-logo-dark  { display: none; }
        nav:not(.scrolled) .brand-logo-light { display: block; }
        /* Solid/scrolled nav (light bg) → show dark logo */
        nav.scrolled .brand-logo-dark  { display: block; }
        nav.scrolled .brand-logo-light { display: none; }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: white;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .nav-links {
            display: flex;
            gap: 35px;
            align-items: center;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.9);

            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            position: relative;
        }

        .nav-link:hover {
            color: white;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            right: 0;

        .cta-btn {

            font-family: 'Montserrat', sans-serif;

            justify-content: center;

            line-height: 1;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(139, 92, 246, 0.5);
        }

        /* Mobile Menu */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            color: white;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;

            height: 44px;

            justify-content: center;

            background: rgba(255, 255, 255, 0.1);

        }

            background: rgba(0, 0, 0, 0.05);

        /* Hero Section */
        .hero-content {

        /* Scroll Indicator */
        .scroll-indicator {
            position: absolute;

            transform: translateX(-50%);

        /* Section Styles */

        /* ========================================
           SCROLL ANIMATIONS & BASIC HOVER EFFECTS
           ======================================== */
        
        /* Scroll Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes typing {
            from {
                width: 0;
            }
            to {
                width: 100%;
            }
        }

        @keyframes blink {
            0%, 100% {
                border-color: transparent;
            }
            50% {
                border-color: #fbbf24;
            }
        }

        .typing-text {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid #fbbf24;
            animation: typing 3s steps(40, end), blink 0.75s step-end infinite;
            animation-delay: 0.5s;
            animation-fill-mode: forwards;
            width: 0;
        }

        /* Scroll Reveal Classes */
        .scroll-reveal {
            opacity: 0;
            transition: none;
        }

        .scroll-reveal.revealed {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .scroll-reveal-left.revealed {
            animation: fadeInLeft 0.8s ease-out forwards;
        }

        .scroll-reveal-right.revealed {
            animation: fadeInRight 0.8s ease-out forwards;
        }

        .scroll-reveal-scale.revealed {
            animation: scaleIn 0.8s ease-out forwards;
        }

        /* Basic Card Hover Effects (Original) */
        .project-card:hover {

        .testimonial-card:hover {

            useEffect(() => {
                const handleScroll = () => {
                    const currentScrollY = window.scrollY;
                    
                    // Hide/show nav based on scroll direction - ONLY ON MOBILE
                    if (window.innerWidth <= 768) {
                        if (currentScrollY > lastScrollY.current && currentScrollY > 100) {
                            // Scrolling down & past 100px
                            setNavVisible(false);
                        } else if (currentScrollY < lastScrollY.current) {
                            // Scrolling up
                            setNavVisible(true);
                        }
                    } else {
                        // On desktop, always show navbar
                        setNavVisible(true);
                    }
                    
                    lastScrollY.current = currentScrollY;
                    setScrolled(currentScrollY > 50);
                    
                    // Scroll Progress Bar
                    const winScroll = document.documentElement.scrollTop;
                    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    const scrolled = (winScroll / height) * 100;
                    const progressBar = document.querySelector('.scroll-progress');
                    if (progressBar) {
                        progressBar.style.width = scrolled + '%';
                    }

                    // Scroll Reveal Animation
                    const reveals = document.querySelectorAll('.scroll-reveal, .scroll-reveal-left, .scroll-reveal-right, .scroll-reveal-scale');
                    reveals.forEach((element) => {
                        const windowHeight = window.innerHeight;
                        const elementTop = element.getBoundingClientRect().top;
                        const elementVisible = 150;
                        
                        if (elementTop < windowHeight - elementVisible) {
                            element.classList.add('revealed');
                        }
                    });
                };
                
                // Initial check
                handleScroll();
                
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

                const handleHashChange = () => {

                    if (hash && ['home', 'services', 'about', 'clients', 'projects', 'testimonials', 'blog', 'portal', 'contact'].includes(hash)) {
                        setCurrentPage(hash);
                    } else if (!hash) {
                        // Default to home if no hash
                        setCurrentPage('home');
                        window.location.hash = 'home';
                    }
                };

                window.addEventListener('hashchange', handleHashChange);
                
                // Set initial page from hash
                handleHashChange();

                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

                const interval = setInterval(() => {

                    setCurrentTestimonial((prev) => (prev + 1) % testimonials.length);

                return () => clearInterval(interval);

                        navVisible={navVisible}

                                {Array(testimonials[currentTestimonial].rating).fill().map((_, i) => <i key={i} className="fas fa-star"></i>)}

                            <p style={{ fontSize: '14px', marginBottom: '14px', lineHeight: '1.6', color: '#334155' }}>
                                "{testimonials[currentTestimonial].text}"

                                <p style={{ fontSize: '13px', fontWeight: '700', marginBottom: '2px', color: '#1e293b' }}>
                                    {testimonials[currentTestimonial].name}
                                </p>
                                <p style={{ fontSize: '12px', color: '#64748b' }}>
                                    {testimonials[currentTestimonial].company}
                                </p>
                            </div>
                        </div>
                    )}

                    <Footer navigate={navigate} />
                </>

        // Animated Counter Component
        function TypingText({ text, speed = 100 }) {
            const [displayText, setDisplayText] = useState('');
            const [currentIndex, setCurrentIndex] = useState(0);
            const [showCursor, setShowCursor] = useState(true);

            useEffect(() => {
                if (currentIndex < text.length) {
                    const timeout = setTimeout(() => {
                        setDisplayText(prev => prev + text[currentIndex]);
                        setCurrentIndex(prev => prev + 1);
                    }, speed);
                    return () => clearTimeout(timeout);
                } else {
                    // Blink cursor after typing is done
                    const cursorInterval = setInterval(() => {
                        setShowCursor(prev => !prev);
                    }, 500);
                    return () => clearInterval(cursorInterval);
                }
            }, [currentIndex, text, speed]);

            return (
                <span style={{display: 'inline-block'}}>
                    {displayText}
                    {showCursor && <span style={{color: '#fbbf24', fontWeight: 'bold'}}>|</span>}
                </span>
            );
        }

        function AnimatedCounter({ target, suffix = '+', duration = 2000 }) {
            const [count, setCount] = useState(0);
            const [hasAnimated, setHasAnimated] = useState(false);
            const counterRef = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    (entries) => {
                        if (entries[0].isIntersecting && !hasAnimated) {
                            setHasAnimated(true);
                            const startTime = Date.now();
                            const endTime = startTime + duration;

                            const updateCounter = () => {
                                const now = Date.now();
                                const progress = Math.min((now - startTime) / duration, 1);
                                
                                // Easing function for smooth animation
                                const easeOutQuart = 1 - Math.pow(1 - progress, 4);
                                const currentCount = Math.floor(easeOutQuart * target);
                                
                                setCount(currentCount);

                                if (progress < 1) {
                                    requestAnimationFrame(updateCounter);
                                } else {
                                    setCount(target);
                                }
                            };

                            requestAnimationFrame(updateCounter);
                        }
                    },
                    { threshold: 0.5 }
                );

                if (counterRef.current) {
                    observer.observe(counterRef.current);
                }

                return () => {
                    if (counterRef.current) {
                        observer.unobserve(counterRef.current);
                    }
                };
            }, [target, duration, hasAnimated]);

            return <span ref={counterRef}>{count}{suffix}</span>;
        }
